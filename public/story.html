<!DOCTYPE html>
<html lang="si" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Reader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { font-family: 'Inter', sans-serif; }

    .glow-btn {
      position: relative;
      transition: all 0.3s ease;
      z-index: 1;
    }
    .glow-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: inherit;
      background: inherit;
      filter: blur(10px);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
    }
    .glow-btn:hover::before {
      opacity: 0.8;
    }
    .glow-btn:hover {
      transform: translateY(-2px);
    }

    .serverButton:disabled {
      background: #475569 !important;
      cursor: not-allowed;
      opacity: 0.8;
      transform: none !important;
    }
    .serverButton:disabled::before {
      display: none !important;
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300 min-h-screen">

  <!-- Header Bar -->
  <header class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md shadow-sm border-b border-gray-200 dark:border-gray-700 sticky top-0 z-50 transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-extrabold text-gray-900 dark:text-white tracking-tight">
          <a href="/">Sinhala <span class="text-blue-600 dark:text-blue-400">Katha</span></a>
        </h1>
      </div>

      <!-- Centered Navigation -->
      <nav class="flex flex-wrap gap-3 items-center justify-center">
        <a href="/" class="glow-btn px-5 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-xs font-bold shadow-md flex items-center gap-1.5">
          <i class="fa fa-home"></i> Home
        </a>
        <a href="/categories.html" class="glow-btn px-5 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-white text-xs font-bold shadow-md flex items-center gap-1.5">
          <i class="fa fa-layer-group"></i> All Series (කතා මාලා)
        </a>
      </nav>

      <div class="flex items-center gap-3">
        <button onclick="toggleDarkMode()" class="p-2.5 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-yellow-400 hover:scale-105 transition" title="Dark/Light Mode">
          <i id="themeIcon" class="fa fa-moon"></i>
        </button>
        <a href="/admin.html" class="text-xs font-bold text-gray-500 dark:text-gray-400 hover:text-blue-600 transition flex items-center gap-1 bg-gray-100 dark:bg-gray-700 px-3.5 py-2 rounded-xl">
          <i class="fa fa-lock"></i> Admin
        </a>
      </div>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">

      <!-- Left: Story Reader -->
      <div class="lg:col-span-2">
        <div id="storyContainer" class="bg-white dark:bg-gray-800 rounded-3xl p-4 sm:p-8 shadow-sm border border-gray-200 dark:border-gray-700">
          <div class="text-center py-12 text-gray-400">Loding...</div>
        </div>
      </div>

      <!-- Right: Sidebar -->
      <aside class="lg:col-span-1 space-y-6">
        
        <!-- Social Communities Box -->
        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-3">
          <h3 class="text-sm font-bold text-gray-900 dark:text-white flex items-center gap-2 mb-2">
            <i class="fa fa-users text-blue-500"></i> අපගේ සමාජ ජාල
          </h3>
          <a href="https://t.me/apedesinhal" target="_blank" class="glow-btn w-full py-2.5 px-4 bg-gradient-to-r from-sky-400 to-blue-500 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-2 shadow-sm">
            <i class="fab fa-telegram text-base"></i> Telegram Channel
          </a>
          <a href="https://web.facebook.com/share/g/1FyeJTMwyP/" target="_blank" class="glow-btn w-full py-2.5 px-4 bg-gradient-to-r from-blue-700 to-indigo-800 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-2 shadow-sm">
            <i class="fab fa-facebook text-base"></i> Facebook Group
          </a>
          <a href="https://whatsapp.com/channel/0029Vb6WiFD7Noa9ikoz4W0w" target="_blank" class="glow-btn w-full py-2.5 px-4 bg-gradient-to-r from-emerald-500 to-green-600 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-2 shadow-sm">
            <i class="fab fa-whatsapp text-base"></i> WhatsApp Channel
          </a>
        </div>

        <!-- Trending Stories Box -->
        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
          <h3 class="text-sm font-bold text-gray-900 dark:text-white flex items-center gap-2 border-b border-gray-100 dark:border-gray-700 pb-3 mb-4">
            <i class="fa fa-fire text-amber-500"></i> වැඩිපුරම නැරඹූ කතා (Trending)
          </h3>
          <div id="trending-container" class="space-y-3.5">
            <div class="text-xs text-gray-400" Loding... </div>
          </div>
        </div>

      </aside>

    </div>
  </main>

  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
      document.getElementById('themeIcon').className = 'fa fa-sun';
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        icon.className = 'fa fa-moon';
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        icon.className = 'fa fa-sun';
      }
    }

    const storyId = new URLSearchParams(window.location.search).get('id');
    let storyData = null;

    // Keys specific ONLY to this single story
    const prefix = 'katha_' + storyId + '_';
    const ad1Key = prefix + 'ad1_done';
    const ad2Key = prefix + 'ad2_done';
    const unlockKey = prefix + 'unlocked_at';
    const activeAdKey = prefix + 'active_ad';
    const departureTimeKey = prefix + 'departed_at';
    const lockDuration = 10 * 60 * 1000; // 10 minutes unlock per story

    fetch(`/api/articles/${storyId}`)
      .then(res => res.json())
      .then(data => {
        storyData = data;
        renderStoryUI();
        updateUI();
      });

    function renderStoryUI() {
      const container = document.getElementById('storyContainer');
      const img = storyData.imageUrl || 'https://images.unsplash.com/photo-1544717305-2782549b5136?w=600';
      const allPartsCategoryUrl = `/?series=${encodeURIComponent(storyData.seriesName || storyData.mainCategory || storyData.category)}`;

      container.innerHTML = `
        <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white text-center mb-2">${storyData.title}</h1>
        
        <div class="flex flex-wrap justify-center items-center gap-3 text-xs sm:text-sm text-gray-500 dark:text-gray-400 mb-5">
          <span>Story by <strong class="text-gray-700 dark:text-gray-200">${storyData.author}</strong> ✍️</span>
          <span>•</span>
          <span class="flex items-center gap-1 text-blue-500 font-semibold"><i class="fa fa-eye"></i> ${storyData.views || 1} Views</span>
          ${storyData.authorEmail ? `<span>•</span><span class="text-xs">📧 ${storyData.authorEmail}</span>` : ''}
        </div>

        <!-- Compact Story Image -->
        <div class="rounded-2xl overflow-hidden mb-5 bg-gray-50 dark:bg-gray-900/40 flex justify-center p-2 border border-gray-100 dark:border-gray-700/60 max-w-xs sm:max-w-sm mx-auto shadow-sm">
          <img src="${img}" class="w-full h-auto max-h-[340px] object-contain rounded-xl" alt="Story Image" onerror="this.src='https://images.unsplash.com/photo-1544717305-2782549b5136?w=600'">
        </div>

        <!-- Public Preview Content -->
        ${storyData.previewContent ? `
          <div class="mb-6 p-4 sm:p-5 rounded-2xl bg-gray-50/80 dark:bg-gray-700/30 border border-gray-100 dark:border-gray-700 text-gray-800 dark:text-gray-200 text-sm sm:text-base leading-relaxed whitespace-pre-line font-normal">
            ${storyData.previewContent}
          </div>
        ` : ''}

        <!-- Timer / Unlock System -->
        <div class="text-center space-y-4 mb-8">
          <div id="instructionArea" class="text-gray-700 dark:text-gray-200 font-bold text-xs sm:text-sm bg-blue-50 dark:bg-gray-700/50 border border-blue-200 dark:border-gray-600 p-4 rounded-xl">
            👇 කතාවේ ඉතිරිය කියවීමට පහත Server 1 සහ Server 2 ක්ලික් කර එම වෙබ් අඩවියේ තත්පර 15 බැගින් රැඳී සිටින්න.
          </div>

          <div id="errorMsg" class="hidden text-red-600 dark:text-red-400 font-bold text-xs sm:text-sm bg-red-50 dark:bg-red-950/30 p-3 rounded-xl border border-red-200 dark:border-red-900">
            ❌ ඔබ Ad එකේ තත්පර 15ක් රැඳී සිටියේ නැත! කරුණාකර නැවත උත්සාහ කරන්න.
          </div>

          <div id="instructionTextUnlocked" class="hidden text-emerald-600 dark:text-emerald-400 font-bold text-sm bg-emerald-50 dark:bg-emerald-950/30 p-4 rounded-xl border border-emerald-200 dark:border-emerald-900">
            ✅ ඔබගේ විනාඩි 10ක කියවීමේ කාලය ආරම්භ විය. සම්පූර්ණ කතාව පහතින් කියවන්න.
          </div>

          <div id="adButtonsWrapper" class="flex gap-4 justify-center">
            <button class="serverButton glow-btn px-6 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-sm font-bold shadow-md" id="server1Button" onclick="openAdLink(1)">Server 1</button>
            <button class="serverButton glow-btn px-6 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-sm font-bold shadow-md" id="server2Button" onclick="openAdLink(2)">Server 2</button>
          </div>
        </div>

        <!-- Locked Story Content -->
        <div id="storyContentBox" class="hidden border-t border-gray-100 dark:border-gray-700 pt-6">
          <div class="text-gray-800 dark:text-gray-200 text-sm sm:text-base leading-relaxed whitespace-pre-line font-medium">
            ${storyData.storyContent}
          </div>
        </div>

        <!-- Bottom Social & Series Buttons -->
        <div class="mt-8 bg-gray-50 dark:bg-gray-700/40 p-4 sm:p-6 rounded-2xl border border-gray-100 dark:border-gray-700 flex flex-col gap-3 items-center">
          
          <!-- All Parts Button -->
          <a href="${storyData.allPartsLink || allPartsCategoryUrl}" class="glow-btn w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 text-white text-xs sm:text-sm font-bold shadow-md flex items-center justify-center gap-2">
            <i class="fa fa-book-open text-base"></i> "${storyData.seriesName || storyData.mainCategory || 'කතා'}" සියලුම කොටස් බලන්න
          </a>

          <!-- Social Buttons Matching Palette -->
          <div class="flex flex-col sm:flex-row gap-2.5 w-full">
            <a href="${storyData.telegramLink}" target="_blank" class="glow-btn flex-1 py-2.5 px-3 bg-gradient-to-r from-sky-400 to-blue-500 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-2 shadow-sm">
              <i class="fab fa-telegram text-base"></i> <span>Telegram Channel</span>
            </a>
            <a href="${storyData.facebookLink}" target="_blank" class="glow-btn flex-1 py-2.5 px-3 bg-gradient-to-r from-blue-700 to-indigo-800 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-2 shadow-sm">
              <i class="fab fa-facebook text-base"></i> <span>Facebook Group</span>
            </a>
            <a href="${storyData.whatsappLink}" target="_blank" class="glow-btn flex-1 py-2.5 px-3 bg-gradient-to-r from-emerald-500 to-green-600 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-2 shadow-sm">
              <i class="fab fa-whatsapp text-base"></i> <span>WhatsApp Channel</span>
            </a>
          </div>

        </div>
      `;
    }

    function openAdLink(serverNum) {
      // Record which button was clicked and time of departure
      sessionStorage.setItem(activeAdKey, String(serverNum));
      sessionStorage.setItem(departureTimeKey, String(Date.now()));
      
      const targetUrl = (serverNum === 1 ? storyData.adLink1 : storyData.adLink2) || 'https://omg10.com/4/10608751';
      window.open(targetUrl, '_blank');
      
      document.getElementById('errorMsg')?.classList.add('hidden');
    }

    function checkReturnValidation() {
      const activeAd = sessionStorage.getItem(activeAdKey);
      const departureTime = sessionStorage.getItem(departureTimeKey);

      if (activeAd && departureTime) {
        const timeSpentAway = (Date.now() - Number(departureTime)) / 1000;

        // Strict 15 seconds away check
        if (timeSpentAway >= 15) {
          if (activeAd === '1') {
            sessionStorage.setItem(ad1Key, 'true');
          } else if (activeAd === '2') {
            sessionStorage.setItem(ad2Key, 'true');
          }

          document.getElementById('errorMsg')?.classList.add('hidden');

          // If both ads watched for 15s each, unlock for 10 minutes
          if (sessionStorage.getItem(ad1Key) === 'true' && sessionStorage.getItem(ad2Key) === 'true') {
            sessionStorage.setItem(unlockKey, String(Date.now()));
          }
        } else {
          // Came back too early
          document.getElementById('errorMsg')?.classList.remove('hidden');
        }

        // Always clear pending click
        sessionStorage.removeItem(activeAdKey);
        sessionStorage.removeItem(departureTimeKey);
        updateUI();
      }
    }

    function updateUI() {
      let unlockTime = sessionStorage.getItem(unlockKey);

      // Check if 10 minutes expired for this specific story
      if (unlockTime && (Date.now() - Number(unlockTime) > lockDuration)) {
        sessionStorage.removeItem(unlockKey);
        sessionStorage.removeItem(ad1Key);
        sessionStorage.removeItem(ad2Key);
        unlockTime = null;
      }

      const ad1Done = sessionStorage.getItem(ad1Key) === 'true';
      const ad2Done = sessionStorage.getItem(ad2Key) === 'true';

      const adButtonsWrapper = document.getElementById('adButtonsWrapper');
      const instructionArea = document.getElementById('instructionArea');
      const storyContentBox = document.getElementById('storyContentBox');
      const unlockedText = document.getElementById('instructionTextUnlocked');

      if (!adButtonsWrapper) return;

      if (unlockTime) {
        adButtonsWrapper.style.display = 'none';
        instructionArea.style.display = 'none';
        storyContentBox.classList.remove('hidden');
        unlockedText.classList.remove('hidden');
      } else {
        adButtonsWrapper.style.display = 'flex';
        instructionArea.style.display = 'block';
        storyContentBox.classList.add('hidden');
        unlockedText.classList.add('hidden');

        const b1 = document.getElementById('server1Button');
        const b2 = document.getElementById('server2Button');

        if (b1) {
          b1.disabled = ad1Done;
          b1.innerHTML = ad1Done ? 'Server 1 (Done ✅)' : 'Server 1';
        }

        if (b2) {
          b2.disabled = ad2Done;
          b2.innerHTML = ad2Done ? 'Server 2 (Done ✅)' : 'Server 2';
        }
      }
    }

    // Trigger validation when user comes back to the page/tab
    window.addEventListener('focus', checkReturnValidation);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        checkReturnValidation();
      }
    });
    window.addEventListener('pageshow', checkReturnValidation);

    // Auto check timer status every second
    setInterval(updateUI, 1000);

    function loadTrending() {
      fetch('/api/trending')
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('trending-container');
          container.innerHTML = '';
          if (!data || data.length === 0) {
            container.innerHTML = '<div class="text-xs text-gray-400">තවමත් නැත.</div>';
            return;
          }
          data.forEach(item => {
            container.innerHTML += `
              <a href="/story.html?id=${item._id}" class="flex items-center gap-3 group">
                <img src="${item.imageUrl}" class="w-12 h-12 rounded-xl object-cover border border-gray-200 dark:border-gray-700" onerror="this.src='https://images.unsplash.com/photo-1544717305-2782549b5136?w=600'">
                <div class="flex-grow">
                  <h4 class="text-xs font-bold text-gray-800 dark:text-gray-200 group-hover:text-blue-500 line-clamp-1">${item.title}</h4>
                  <span class="text-[10px] text-gray-400 flex items-center gap-1 mt-0.5"><i class="fa fa-eye text-amber-500"></i> ${item.views || 0} views</span>
                </div>
              </a>
            `;
          });
        });
    }

    loadTrending();
  </script>
</body>
</html>
