<!DOCTYPE html>
<html lang="si" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinhala Katha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { font-family: 'Inter', sans-serif; }

    .glow-btn {
      position: relative;
      transition: all 0.3s ease;
      z-index: 1;
    }
    .glow-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: inherit;
      background: inherit;
      filter: blur(10px);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
    }
    .glow-btn:hover::before {
      opacity: 0.8;
    }
    .glow-btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300 min-h-screen">

  <!-- Header Bar -->
  <header class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md shadow-sm border-b border-gray-200 dark:border-gray-700 sticky top-0 z-50 transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-extrabold text-gray-900 dark:text-white tracking-tight">
          <a href="/">Sinhala <span class="text-blue-600 dark:text-blue-400">Katha</span></a>
        </h1>
      </div>

      <!-- Top Navigation Bar with All 3 Buttons -->
      <nav class="flex flex-wrap gap-3 items-center justify-center relative">
        <a href="/" class="glow-btn px-4 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-xs font-bold shadow-md flex items-center gap-1.5">
          <i class="fa fa-home"></i> Home
        </a>
        <a href="/categories.html" class="glow-btn px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-white text-xs font-bold shadow-md flex items-center gap-1.5">
          <i class="fa fa-layer-group"></i> All Series 
        </a>

        <!-- Category Dropdown Button in Navigation -->
        <div class="relative inline-block text-left">
          <button onclick="toggleDropdown()" id="categoryDropdownBtn" class="glow-btn px-4 py-2 rounded-xl bg-gradient-to-r from-purple-600 via-fuchsia-600 to-pink-600 text-white text-xs font-bold shadow-md flex items-center gap-2">
            <i class="fa fa-list"></i>
            <span id="selectedCategoryLabel"> Select Category </span>
            <i class="fa fa-chevron-down text-[10px] ml-0.5 transition-transform duration-300" id="dropdownArrow"></i>
          </button>

          <!-- Dropdown Menu List -->
          <div id="categoryDropdownMenu" class="hidden absolute left-0 sm:left-auto sm:right-0 mt-2 w-64 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 py-2 overflow-hidden z-50 transition-all duration-200">
            <button onclick="selectCategory('All', ' All Stories ')" class="w-full text-left px-4 py-2.5 text-xs font-bold hover:bg-purple-50 dark:hover:bg-gray-700 flex items-center gap-2.5 transition">
              <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> All Stories 
            </button>
            <button onclick="selectCategory('නවකතා', '📖 නවකතා (Novels)')" class="w-full text-left px-4 py-2.5 text-xs font-bold hover:bg-purple-50 dark:hover:bg-gray-700 flex items-center gap-2.5 transition">
              <span class="w-2.5 h-2.5 rounded-full bg-pink-500"></span> 📖 නවකතා
            </button>
            <button onclick="selectCategory('කෙටිකතා', '📑 කෙටිකතා (Short Stories)')" class="w-full text-left px-4 py-2.5 text-xs font-bold hover:bg-purple-50 dark:hover:bg-gray-700 flex items-center gap-2.5 transition">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 📑 කෙටිකතා
            </button>
            <button onclick="selectCategory('English Stories', '🇬🇧 English Stories')" class="w-full text-left px-4 py-2.5 text-xs font-bold hover:bg-purple-50 dark:hover:bg-gray-700 flex items-center gap-2.5 transition">
              <span class="w-2.5 h-2.5 rounded-full bg-cyan-500"></span> 🇬🇧 English Stories
            </button>
            <button onclick="selectCategory('Tamil Stories', '🇮🇳 Tamil Stories')" class="w-full text-left px-4 py-2.5 text-xs font-bold hover:bg-purple-50 dark:hover:bg-gray-700 flex items-center gap-2.5 transition">
              <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span> 🇮🇳 Tamil Stories
            </button>
            <button onclick="selectCategory('චිත්‍රකතා', '🎨 චිත්‍රකතා (Comics)')" class="w-full text-left px-4 py-2.5 text-xs font-bold hover:bg-purple-50 dark:hover:bg-gray-700 flex items-center gap-2.5 transition">
              <span class="w-2.5 h-2.5 rounded-full bg-yellow-500"></span> 🎨 චිත්‍රකතා
            </button>
            <button onclick="selectCategory('Japan Stories', '🇯🇵 Japan Stories')" class="w-full text-left px-4 py-2.5 text-xs font-bold hover:bg-purple-50 dark:hover:bg-gray-700 flex items-center gap-2.5 transition">
              <span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span> 🇯🇵 Japan Stories
            </button>
            <button onclick="selectCategory('China Stories', '🇨🇳 China Stories')" class="w-full text-left px-4 py-2.5 text-xs font-bold hover:bg-purple-50 dark:hover:bg-gray-700 flex items-center gap-2.5 transition">
              <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> 🇨🇳 China Stories
            </button>
          </div>
        </div>
      </nav>

      <div class="flex items-center gap-3">
        <button onclick="toggleDarkMode()" class="p-2.5 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-yellow-400 hover:scale-105 transition" title="Dark/Light Mode">
          <i id="themeIcon" class="fa fa-moon"></i>
        </button>
        <a href="/admin.html" class="text-xs font-bold text-gray-500 dark:text-gray-400 hover:text-blue-600 transition flex items-center gap-1 bg-gray-100 dark:bg-gray-700 px-3.5 py-2 rounded-xl">
          <i class="fa fa-lock"></i> Admin
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">

    <!-- Active Filter Banner -->
    <div id="categoryBanner" class="hidden mb-6 bg-purple-50 dark:bg-gray-800 border border-purple-200 dark:border-gray-700 p-4 rounded-2xl flex justify-between items-center">
      <div>
        <span class="text-xs text-gray-500 uppercase font-bold">තෝරාගත් Category / Series එක:</span>
        <h3 id="currentCatName" class="text-xl font-extrabold text-purple-600 dark:text-purple-400"></h3>
      </div>
      <button onclick="selectCategory('All', 'ප්‍රවර්ග තෝරන්න (Select Category)')" class="glow-btn px-4 py-1.5 rounded-xl bg-purple-600 text-white text-xs font-bold shadow-sm">Show All</button>
    </div>

    <!-- 2-Column Responsive Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 items-start">
      
      <!-- Main Stories Grid -->
      <div class="lg:col-span-3">
        <div id="articles-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 items-start">
          <div class="col-span-full py-20 text-center text-gray-400 font-semibold"> Loading... </div>
        </div>
      </div>

      <!-- Right Sidebar -->
      <aside class="lg:col-span-1 space-y-6">
        
        <!-- Social Channels -->
        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-3">
          <h3 class="text-sm font-bold text-gray-900 dark:text-white flex items-center gap-2 mb-2">
            <i class="fa fa-users text-blue-500"></i> අපගේ සමාජ ජාල
          </h3>
          <a href="https://t.me/apedesinhal" target="_blank" class="glow-btn w-full py-2.5 px-4 bg-gradient-to-r from-sky-400 to-blue-500 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-2 shadow-sm">
            <i class="fab fa-telegram text-base"></i> Telegram Channel
          </a>
          <a href="https://web.facebook.com/share/g/1FyeJTMwyP/" target="_blank" class="glow-btn w-full py-2.5 px-4 bg-gradient-to-r from-blue-700 to-indigo-800 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-2 shadow-sm">
            <i class="fab fa-facebook text-base"></i> Facebook Group
          </a>
          <a href="https://whatsapp.com/channel/0029Vb6WiFD7Noa9ikoz4W0w" target="_blank" class="glow-btn w-full py-2.5 px-4 bg-gradient-to-r from-emerald-500 to-green-600 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-2 shadow-sm">
            <i class="fab fa-whatsapp text-base"></i> WhatsApp Channel
          </a>
        </div>

        <!-- Trending Box -->
        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
          <h3 class="text-sm font-bold text-gray-900 dark:text-white flex items-center gap-2 border-b border-gray-100 dark:border-gray-700 pb-3 mb-4">
            <i class="fa fa-fire text-amber-500"></i> වැඩිපුරම නැරඹූ කතා (Trending)
          </h3>
          <div id="trending-container" class="space-y-3.5">
            <div class="text-xs text-gray-400"> Loading... </div>
          </div>
        </div>

      </aside>

    </div>

  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let currentMainCat = urlParams.get('mainCategory') || 'All';
    let currentSeries = urlParams.get('series') || 'All';

    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      document.getElementById('themeIcon').className = 'fa fa-sun';
    } else {
      document.documentElement.classList.remove('dark');
      document.getElementById('themeIcon').className = 'fa fa-moon';
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        icon.className = 'fa fa-moon';
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        icon.className = 'fa fa-sun';
      }
    }

    // Dropdown Toggle
    function toggleDropdown() {
      const menu = document.getElementById('categoryDropdownMenu');
      const arrow = document.getElementById('dropdownArrow');
      menu.classList.toggle('hidden');
      arrow.classList.toggle('rotate-180');
    }

    // Close Dropdown when clicked outside
    window.addEventListener('click', function (e) {
      const btn = document.getElementById('categoryDropdownBtn');
      const menu = document.getElementById('categoryDropdownMenu');
      if (btn && menu && !btn.contains(e.target) && !menu.contains(e.target)) {
        menu.classList.add('hidden');
        document.getElementById('dropdownArrow').classList.remove('rotate-180');
      }
    });

    function selectCategory(cat, label) {
      currentMainCat = cat;
      currentSeries = 'All';
      document.getElementById('selectedCategoryLabel').innerText = cat === 'All' ? 'ප්‍රවර්ග තෝරන්න (Select Category)' : label;
      document.getElementById('categoryDropdownMenu').classList.add('hidden');
      document.getElementById('dropdownArrow').classList.remove('rotate-180');
      updateBanner(cat === 'All' ? 'All' : label);
      loadStories();
    }

    function updateBanner(text) {
      const banner = document.getElementById('categoryBanner');
      if (text !== 'All') {
        banner.classList.remove('hidden');
        document.getElementById('currentCatName').innerText = text;
      } else {
        banner.classList.add('hidden');
      }
    }

    function loadStories() {
      let queryUrl = '/api/articles?';
      if (currentMainCat !== 'All') queryUrl += `mainCategory=${encodeURIComponent(currentMainCat)}&`;
      if (currentSeries !== 'All') queryUrl += `series=${encodeURIComponent(currentSeries)}&`;

      fetch(queryUrl)
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('articles-container');
          container.innerHTML = '';

          if (!data || data.length === 0) {
            container.innerHTML = '<div class="col-span-full py-16 text-center text-gray-400">මෙම ප්‍රවර්ගය යටතේ කතා නොමැත.</div>';
            return;
          }

          data.forEach(story => {
            const img = story.imageUrl || 'https://images.unsplash.com/photo-1544717305-2782549b5136?w=600';
            const displayBadge = story.seriesName || story.mainCategory || 'කතා';

            container.innerHTML += `
              <div onclick="location.href='/story.html?id=${story._id}'" class="cursor-pointer bg-white dark:bg-gray-800 rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-200 dark:border-gray-700 flex flex-col group transform hover:-translate-y-1">
                
                <div class="w-full h-64 overflow-hidden bg-gray-50 dark:bg-gray-900/40 relative flex items-center justify-center p-2">
                  <img src="${img}" alt="${story.title}" class="max-w-full max-h-full object-contain group-hover:scale-105 transition-transform duration-300 pointer-events-none" onerror="this.src='https://images.unsplash.com/photo-1544717305-2782549b5136?w=600'">
                  <button onclick="event.stopPropagation(); selectCategory('${story.mainCategory}', '${story.mainCategory}')" class="absolute top-3 right-3 bg-black/70 hover:bg-blue-600 transition backdrop-blur-md text-white text-[11px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">${displayBadge}</button>
                </div>

                <div class="p-4 flex flex-col flex-grow justify-between bg-white dark:bg-gray-800 border-t border-gray-100 dark:border-gray-700">
                  <div>
                    <h2 class="font-bold text-gray-900 dark:text-white text-base leading-snug group-hover:text-blue-600 dark:group-hover:text-blue-400 transition line-clamp-2">${story.title}</h2>
                    <div class="flex items-center gap-3 text-xs text-gray-400 mt-2">
                      <span>By ${story.author}</span>
                      <span>•</span>
                      <span class="flex items-center gap-1"><i class="fa fa-eye text-[10px]"></i> ${story.views || 0}</span>
                    </div>
                  </div>
                  <div class="mt-4 pt-3 border-t border-gray-100 dark:border-gray-700 flex items-center justify-between">
                    <span class="text-xs text-blue-600 dark:text-blue-400 font-bold flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                      Read more &raquo;
                    </span>
                  </div>
                </div>

              </div>
            `;
          });
        });
    }

    function loadTrending() {
      fetch('/api/trending')
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('trending-container');
          container.innerHTML = '';
          if (!data || data.length === 0) {
            container.innerHTML = '<div class="text-xs text-gray-400">තවමත් නැත.</div>';
            return;
          }
          data.forEach(item => {
            container.innerHTML += `
              <a href="/story.html?id=${item._id}" class="flex items-center gap-3 group">
                <img src="${item.imageUrl}" class="w-12 h-12 rounded-xl object-cover border border-gray-200 dark:border-gray-700 pointer-events-none" onerror="this.src='https://images.unsplash.com/photo-1544717305-2782549b5136?w=600'">
                <div class="flex-grow">
                  <h4 class="text-xs font-bold text-gray-800 dark:text-gray-200 group-hover:text-blue-500 line-clamp-1">${item.title}</h4>
                  <span class="text-[10px] text-gray-400 flex items-center gap-1 mt-0.5"><i class="fa fa-eye text-amber-500"></i> ${item.views || 0} views</span>
                </div>
              </a>
            `;
          });
        });
    }

    if (currentMainCat !== 'All') {
      updateBanner(currentMainCat);
      document.getElementById('selectedCategoryLabel').innerText = currentMainCat;
    } else if (currentSeries !== 'All') {
      updateBanner(currentSeries);
    }
    loadStories();
    loadTrending();
  </script>
</body>
</html>
